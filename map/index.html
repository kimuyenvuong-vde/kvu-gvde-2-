<!DOCTYPE html>
<html lang="en" data-theme="light" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honeymoon Map — Giamo &amp; Kim Uyên</title>
  <meta name="google" content="notranslate">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="icon" href="../favicon.ico" sizes="any">

  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem('weddingTheme'); } catch (_) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (saved === 'dark' || (saved !== 'light' && prefersDark)) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="dark"] {
      --bg:           #070706;
      --gold:         #D4A84A;
      --gold-bright:  #F0C85A;
      --gold-pale:    #F8DF90;
      --gold-dim:     #A07830;
      --gold-dark:    #6A5018;
      --text-bright:  #F8D878;
      --text-dim:     #B89040;
      --border:       #6A5018;
      --card-bg:      #0D0C0A;
      --overlay-bg:   rgba(4,4,3,0.94);
    }
    [data-theme="light"] {
      --bg:           #F8F2E4;
      --gold:         #7A5010;
      --gold-bright:  #9A6818;
      --gold-pale:    #B88828;
      --gold-dim:     #5A3C0A;
      --gold-dark:    #C8A048;
      --text-bright:  #1A0E08;
      --text-dim:     #5C3A20;
      --border:       #C8A048;
      --card-bg:      #F8F2E4;
      --overlay-bg:   rgba(20,14,8,0.94);
    }

    body {
      font-family: 'EB Garamond', serif;
      background: var(--bg);
      color: var(--text-dim);
      min-height: 100vh;
    }

    .top-bar {
      position: sticky; top: 0; z-index: 400;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .top-bar-links { display: flex; gap: 10px; }
    .back-link {
      font-family: 'Cinzel', serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.2em; color: var(--gold-dim); text-decoration: none;
      border: 1px solid var(--border); padding: 8px 14px; transition: all 0.2s; white-space: nowrap;
    }
    .back-link:hover { background: var(--border); color: var(--text-bright); }
    .theme-btn {
      background: transparent; border: 1px solid var(--border); color: var(--gold-dim);
      width: 34px; height: 34px; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .theme-btn:hover { background: var(--border); color: var(--text-bright); }

    .map-header { text-align: center; padding: 40px 24px 24px; }
    .gh-eyebrow {
      font-family: 'Cinzel', serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.4em; color: var(--gold-dim); margin-bottom: 14px;
    }
    .gh-title {
      font-family: 'Cinzel', serif; font-size: clamp(24px, 5vw, 42px); font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(175deg, var(--gold-pale) 0%, var(--gold) 55%, var(--gold-dim) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    [data-theme="light"] .gh-title { -webkit-text-fill-color: var(--gold); background: none; }

    #map { width: 100%; height: 72vh; min-height: 420px; }
    [data-theme="dark"] #map { filter: brightness(0.88) saturate(0.85); }

    .leaflet-popup-content-wrapper {
      background: var(--card-bg); color: var(--text-dim);
      border: 1px solid var(--border); border-radius: 0;
    }
    .leaflet-popup-tip { background: var(--card-bg); border: 1px solid var(--border); }
    .map-popup img {
      width: 160px; height: 160px; object-fit: cover; display: block; cursor: pointer;
    }
    .map-popup .n { text-align: center; font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.1em; color: var(--gold-dim); padding-top: 6px; }

    .pin-marker {
      width: 14px; height: 14px; border-radius: 50% 50% 50% 0;
      background: var(--gold); border: 1.5px solid var(--gold-pale);
      transform: rotate(-45deg);
    }

    footer {
      text-align: center; padding: 40px 24px;
      border-top: 1px solid var(--border);
      font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.24em; color: var(--gold-dim);
    }

    /* ── LIGHTBOX (reused pattern) ──────────── */
    .lightbox {
      position: fixed; inset: 0; background: var(--overlay-bg); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 86vh; object-fit: contain; }
    .lb-close {
      position: fixed; top: 20px; right: 20px;
      background: transparent; border: 1px solid var(--border); color: var(--gold-pale);
      cursor: pointer; font-size: 20px; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .lb-close:hover { background: var(--gold-dim); color: var(--bg); }
  </style>
</head>
<body>

  <nav class="top-bar">
    <div class="top-bar-links">
      <a class="back-link" href="../index.html">← Home</a>
      <a class="back-link" href="../gallery/index.html">Photos</a>
      <a class="back-link" href="../videos/index.html">Videos</a>
      <a class="back-link" href="../timeline/index.html">Timeline</a>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark">☀</button>
  </nav>

  <header class="map-header">
    <p class="gh-eyebrow">✦ &nbsp; Where We Went &nbsp; ✦</p>
    <h1 class="gh-title">Honeymoon Map</h1>
  </header>

  <div id="map"></div>

  <footer>Giamo &amp; Kim Uyên — Honeymoon Map</footer>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <img id="lb-img" src="" alt="">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script>
    function toggleTheme() {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('weddingTheme', next); } catch (_) {}
      document.getElementById('theme-btn').textContent = next === 'dark' ? '☾' : '☀';
    }
    (function () {
      document.getElementById('theme-btn').textContent =
        document.documentElement.getAttribute('data-theme') === 'dark' ? '☾' : '☀';
    })();

    function openLightbox(src) {
      document.getElementById('lb-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    const map = L.map('map', { scrollWheelZoom: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    const pinIcon = L.divIcon({ className: 'pin-marker', iconSize: [14, 14] });
    const cluster = L.markerClusterGroup({
      iconCreateFunction: function (c) {
        return L.divIcon({
          html: `<div style="background:var(--gold, #D4A84A);color:#070706;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;font-size:13px;border:2px solid #F8DF90;">${c.getChildCount()}</div>`,
          className: '', iconSize: [38, 38]
        });
      }
    });

    fetch('points.json')
      .then(r => r.json())
      .then(points => {
        const bounds = [];
        points.forEach(p => {
          const m = L.marker([p.lat, p.lon], { icon: pinIcon });
          const thumbUrl = '../gallery/' + p.thumb;
          const displayUrl = '../gallery/' + p.display;
          const popupEl = document.createElement('div');
          popupEl.className = 'map-popup';
          const img = document.createElement('img');
          img.src = thumbUrl;
          img.loading = 'lazy';
          img.onclick = () => openLightbox(displayUrl);
          popupEl.appendChild(img);
          const n = document.createElement('div');
          n.className = 'n';
          n.textContent = p.tags.filter(t => t !== 'Japan' && t !== 'Vietnam').slice(0, 2).join(' · ') || p.tags[0] || '';
          popupEl.appendChild(n);
          m.bindPopup(popupEl);
          cluster.addLayer(m);
          bounds.push([p.lat, p.lon]);
        });
        map.addLayer(cluster);
        if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
        else map.setView([20, 122], 4);
      })
      .catch(() => { map.setView([20, 122], 4); });
  </script>
</body>
</html>
